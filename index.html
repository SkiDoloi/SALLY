<script>

/* GitHub repository settings */

const username = "skidoloi";
const repository = "SALLY";
const folder = "photos";

const apiURL =
    "https://api.github.com/repos/" +
    username +
    "/" +
    repository +
    "/contents/" +
    folder;

let mediaLoaded = false;


async function loadMedia() {

    if (mediaLoaded) return;

    const gallery = document.getElementById("gallery");

    try {

        const response = await fetch(apiURL);

        if (!response.ok) {
            throw new Error("Could not access photos folder");
        }

        const files = await response.json();

        gallery.innerHTML = "";


        files.forEach(file => {

            const name = file.name.toLowerCase();


            /* =====================
               IMAGE FILES
            ===================== */

            if (
                name.endsWith(".jpg") ||
                name.endsWith(".jpeg") ||
                name.endsWith(".png") ||
                name.endsWith(".webp") ||
                name.endsWith(".gif")
            ) {

                const image = document.createElement("img");

                image.src = file.download_url;
                image.alt = "Sally";
                image.loading = "lazy";

                image.onclick = function () {
                    openPhoto(file.download_url);
                };

                gallery.appendChild(image);
            }


            /* =====================
               MP4 VIDEOS
            ===================== */

            else if (
                name.endsWith(".mp4")
            ) {

                const video =
                    document.createElement("video");

                video.src = file.download_url;

                video.controls = true;

                video.preload = "metadata";

                video.style.width = "100%";

                video.style.borderRadius = "12px";

                gallery.appendChild(video);
            }

        });


        if (gallery.children.length === 0) {

            gallery.innerHTML =
                "<div class='loading'>" +
                "No photos or videos found yet." +
                "</div>";

        }


        mediaLoaded = true;

    }

    catch (error) {

        console.error(
            "Error loading Sally's memories:",
            error
        );

        gallery.innerHTML =
            "<div class='loading'>" +
            "Could not load Sally's photos and videos." +
            "</div>";

    }

}


/* Show Sally's memories */

function showMemories() {

    const section =
        document.getElementById("gallery-section");

    section.style.display = "block";

    section.scrollIntoView({
        behavior: "smooth"
    });

    loadMedia();

}


/* Open image fullscreen */

function openPhoto(url) {

    const fullscreen =
        document.getElementById("fullscreen");

    const image =
        document.getElementById("fullscreen-image");

    image.src = url;

    fullscreen.style.display = "flex";

}


/* Close fullscreen */

function closePhoto() {

    document.getElementById("fullscreen")
        .style.display = "none";

}

</script>
